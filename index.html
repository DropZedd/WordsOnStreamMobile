<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#240754">
  <title>Words With Zedd — Mobile Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900;1000&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{color-scheme:dark;--bg:#17052f;--panel:#26094d;--accent:#8b3dff;--cyan:#67e8f9;--yellow:#fde047}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:22px 16px;background:radial-gradient(circle at 50% 0,#4c1d95,var(--bg) 65%);font-family:Nunito,system-ui,sans-serif;color:#fff;display:flex;justify-content:center;align-items:flex-start}
    main{width:min(100%,480px);background:rgba(20,4,44,.94);border:3px solid var(--accent);border-radius:24px;padding:22px;box-shadow:0 12px 35px #0008}
    h1{font-size:clamp(27px,7vw,38px);line-height:1;margin:0;text-align:center;font-weight:1000}
    .sub{text-align:center;color:var(--cyan);font-weight:900;margin:8px 0 22px}
    label{display:block;font-weight:900;margin:14px 0 6px}
    input{width:100%;padding:14px;border:2px solid #6b21a8;border-radius:12px;background:#120326;color:white;font:700 18px Nunito,system-ui,sans-serif;outline:none}
    input:focus{border-color:var(--cyan)}
    button{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(90deg,#7e22ce,#9333ea);color:white;font-size:17px;font-weight:1000;cursor:pointer;margin-top:14px}
    button:disabled{opacity:.5;cursor:not-allowed}
    .panel{margin-top:18px;padding:16px;border-radius:16px;background:#120326;border:1px solid #55218a}
    .hidden{display:none!important}
    #letters{font-size:clamp(27px,9vw,42px);font-weight:1000;letter-spacing:.18em;text-align:center;color:var(--yellow);padding:12px 0;overflow-wrap:anywhere}
    #status{min-height:24px;margin-top:14px;text-align:center;font-weight:900;color:var(--cyan)}
    .hint{font-size:13px;color:#c4b5fd;text-align:center;margin-top:12px}
    .code{color:var(--yellow);font-weight:1000;letter-spacing:.12em}
  </style>
</head>
<body>
<main>
  <h1>WORDS WITH ZEDD</h1>
  <div class="sub">MOBILE PLAYER</div>

  <section id="join-panel">
    <label for="join-code">Game code</label>
    <input id="join-code" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ENTER GAME CODE">
    <label for="player-name">Your player name</label>
    <input id="player-name" maxlength="24" autocomplete="nickname" placeholder="ENTER YOUR NAME">
    <button id="join-button" type="button">JOIN GAME</button>
  </section>

  <section id="game-panel" class="panel hidden">
    <div style="text-align:center;font-weight:900">CONNECTED TO GAME <span id="game-code" class="code"></span></div>
    <div id="letters" aria-label="Current game letters">WAITING FOR ROUND…</div>
    <label for="word-input">Your word</label>
    <input id="word-input" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="TYPE A WORD">
    <button id="submit-button" type="button">SUBMIT WORD</button>
    <div class="hint">Words are checked by the live game. First valid submission wins.</div>
  </section>

  <div id="status" role="status" aria-live="polite">Scan the stream's QR code or enter the game code.</div>
  <div class="hint">No app download required.</div>
</main>
<script>
(() => {
  const SUPABASE_URL = "https://wqdgxplujjylbolopokj.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4K42_1Ut-Svhtk3wWjqrAg_cb-5dTHw";
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const $ = id => document.getElementById(id);

  let activeCode = "";
  let playerId = "";
  let playerName = "";
  let currentRoundId = "";
  let pollTimer = null;
  let submitting = false;
  let sessionEnded = false;
  const ACTIVE_CODE_KEY = "wos_mobile_active_code_v1";

  function setStatus(message, isError = false) {
    $("status").textContent = message;
    $("status").style.color = isError ? "#fda4af" : "#67e8f9";
  }

  // Conservative hate-speech name filter. Ordinary profanity is not blocked.
  // Normalize common leetspeak and separators so simple disguises are caught.
  function normalizePlayerName(value) {
    return String(value || "")
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[0@]/g, "o")
      .replace(/[1!|]/g, "i")
      .replace(/[3]/g, "e")
      .replace(/[4@]/g, "a")
      .replace(/[5$]/g, "s")
      .replace(/[7+]/g, "t")
      .replace(/[8]/g, "b")
      .replace(/[^a-z0-9]/g, "");
  }

  const BLOCKED_NAME_TERMS = new Set([
    "nigger", "niggers", "nigga", "niggas",
    "faggot", "faggots", "dyke", "tranny",
    "kike", "kikes", "spic", "spics",
    "chink", "chinks", "wetback", "wetbacks",
    "coon", "coons", "gook", "gooks",
    "raghead", "ragheads", "towelhead", "towelheads",
    "retard", "retards",
    "nazis", "nazi", "kkk"
  ]);

  function isAllowedPlayerName(value) {
    const normalized = normalizePlayerName(value);
    if (!normalized) return false;

    // Compare both the whole name and its separated word parts.
    const parts = String(value || "")
      .normalize("NFKD")
      .toLowerCase()
      .split(/[^a-z0-9]+/)
      .filter(Boolean)
      .map(normalizePlayerName);

    return !BLOCKED_NAME_TERMS.has(normalized) &&
      !parts.some(part => BLOCKED_NAME_TERMS.has(part));
  }

  function getPlayerId() {
    const key = "wos_mobile_player_id_v1";
    let id = localStorage.getItem(key);

    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : "p-" + Math.random().toString(36).slice(2) + Date.now().toString(36));
      localStorage.setItem(key, id);
    }

    return id;
  }

  async function callGameFunction(payload) {
    const { data, error } = await client.functions.invoke("super-service", { body: payload });

    if (error) {
      let serverMessage = (data && (data.error || data.message)) || "";
      let statusCode = error.context && error.context.status;

      // Supabase FunctionsHttpError keeps the response body in context.
      // Read it so expected game responses can be translated into player-friendly text.
      if (error.context && typeof error.context.clone === "function") {
        try {
          const response = error.context.clone();
          statusCode = response.status || statusCode;
          const body = await response.json();
          serverMessage = body.error || body.message || body.details || serverMessage;
        } catch (_) {
          // The response may have no JSON body; use the status/message below.
        }
      }

      const message = String(serverMessage || error.message || "");

      if (
        payload.action === "submit_word" &&
        /already been submitted this round|already submitted this round|word already found/i.test(message)
      ) {
        throw new Error("Word already found! Try another word.");
      }

      if (
        (payload.action === "submit_word" || payload.action === "get_session") &&
        /player name isn't allowed/i.test(message)
      ) {
        throw new Error("That player name isn't allowed. Please choose another name.");
      }

      if (
        payload.action === "submit_word" &&
        (statusCode === 400 || /word is not on this board|word not found|invalid word/i.test(message))
      ) {
        throw new Error("Word not found. Try another word!");
      }

      if (
        (payload.action === "submit_word" || payload.action === "get_session") &&
        (statusCode === 409 || /next round is not ready|round is not ready/i.test(message))
      ) {
        throw new Error("Waiting for host to restart the next round…");
      }

      if (/game not found|no longer active|game has ended/i.test(message)) {
        throw new Error("This game has ended.");
      }

      // Never expose the generic Supabase "Edge Function returned a non-2xx status code".
      if (/edge function returned a non-2xx status code/i.test(message) || !message) {
        throw new Error("Couldn't reach the game server. Please try again.");
      }

      throw new Error(message);
    }

    if (data && data.error) {
      const message = String(data.error);

      if (
        (payload.action === "submit_word" || payload.action === "get_session") &&
        /player name isn't allowed/i.test(message)
      ) {
        throw new Error("That player name isn't allowed. Please choose another name.");
      }

      if (
        payload.action === "submit_word" &&
        /word is not on this board|word not found|invalid word/i.test(message)
      ) {
        throw new Error("Word not found. Try another word!");
      }

      if (/next round is not ready|round is not ready/i.test(message)) {
        throw new Error("Waiting for host to restart the next round…");
      }

      throw new Error(message);
    }

    return data;
  }

  function showRound(session, announce = false) {
    const nextRoundId = session.round_id || "";

    // Use only the shuffled letters sent by the overlay.
    // Do not fall back to board_root, which is the unsorted root word.
    const letters = session.board_letters || "";

    if (nextRoundId && nextRoundId !== currentRoundId) {
      currentRoundId = nextRoundId;
      $("word-input").value = "";

      if (announce && letters) {
        setStatus("New round! The board has been updated.");
      }
    }

    $("letters").textContent = letters || "WAITING FOR ROUND…";
    $("submit-button").disabled = !letters || sessionEnded;

    if (!letters && !sessionEnded) {
      setStatus("Waiting for host to restart the next round…");
    } else if (letters && announce) {
      setStatus("New round! The board has been updated.");
    }
  }

  async function refreshSession(quiet = true) {
    if (!activeCode || sessionEnded) return;

    try {
      const session = await callGameFunction({
        action: "get_session",
        join_code: activeCode,
        player_name: playerName
      });

      if (!session || session.status !== "active") {
        throw new Error("This game has ended.");
      }

      const changed =
        !!session.round_id &&
        session.round_id !== currentRoundId;

      showRound(session, changed);
    } catch (error) {
      if (/no longer active|game not found|game has ended/i.test(error.message)) {
        sessionEnded = true;
        clearInterval(pollTimer);
        localStorage.removeItem(ACTIVE_CODE_KEY);
        $("submit-button").disabled = true;
        setStatus("This game has ended. Thanks for playing!");
      } else if (!quiet) {
        setStatus(error.message || "Could not refresh the game.", true);
      }
    }
  }

  async function joinGame() {
    const code = $("join-code").value.trim().toUpperCase();
    const name = $("player-name").value.trim();

    if (!/^[A-Z2-9]{6}$/.test(code)) {
      return setStatus("Enter the six-character game code from the stream.", true);
    }

    if (!name) {
      return setStatus("Enter a player name.", true);
    }

    if (name.length > 24) {
      return setStatus("Player names must be 24 characters or fewer.", true);
    }

    if (!isAllowedPlayerName(name)) {
      return setStatus("That player name isn't allowed. Please choose another name.", true);
    }

    $("join-button").disabled = true;
    setStatus("Connecting to the game…");

    try {
      const session = await callGameFunction({
        action: "get_session",
        join_code: code,
        player_name: name
      });

      if (!session || session.status !== "active") {
        throw new Error("That game is not active. Wait for the streamer to start a round.");
      }

      activeCode = code;
      playerName = name;
      playerId = getPlayerId();

      localStorage.setItem(ACTIVE_CODE_KEY, activeCode);
      localStorage.setItem("wos_mobile_player_name_v1", playerName);

      $("game-code").textContent = code;
      $("join-panel").classList.add("hidden");
      $("game-panel").classList.remove("hidden");

      showRound(session);

      setStatus(
        session.board_letters
          ? "You're in! Find words and submit them here."
          : "Connected! Waiting for host to restart the next round…"
      );

      $("word-input").focus();

      clearInterval(pollTimer);
      pollTimer = setInterval(() => refreshSession(true), 2500);
    } catch (error) {
      setStatus(error.message || "Unable to join this game.", true);
    } finally {
      $("join-button").disabled = false;
    }
  }

  async function restoreActiveSession() {
    const savedCode = localStorage.getItem(ACTIVE_CODE_KEY);
    const savedName = localStorage.getItem("wos_mobile_player_name_v1") || "";
    const urlCode = new URLSearchParams(location.search).get("code") || "";

    // A newly scanned QR code for a different game takes precedence.
    if (!savedCode || !savedName || (urlCode && urlCode.toUpperCase() !== savedCode)) {
      if (urlCode) $("join-code").value = urlCode.toUpperCase();
      return;
    }

    $("join-code").value = savedCode;
    $("player-name").value = savedName;
    setStatus("Reconnecting to your game…");

    try {
      const session = await callGameFunction({ action: "get_session", join_code: savedCode, player_name: savedName });
      if (!session || session.status !== "active") {
        localStorage.removeItem(ACTIVE_CODE_KEY);
        setStatus("Your previous game has ended. Enter the new game code to join.");
        return;
      }

      activeCode = savedCode;
      playerName = savedName;
      playerId = getPlayerId();
      sessionEnded = false;
      $("game-code").textContent = activeCode;
      $("join-panel").classList.add("hidden");
      $("game-panel").classList.remove("hidden");
      showRound(session);
      setStatus(session.board_letters ? "Reconnected! You're back in the game." : "Reconnected. Waiting for host to restart the next round…");
      clearInterval(pollTimer);
      pollTimer = setInterval(() => refreshSession(true), 2500);
    } catch (error) {
      // Preserve the saved code after temporary network/server errors.
      setStatus("Couldn't reconnect right now. Your game code is saved—tap JOIN GAME to retry.", true);
    }
  }
  async function submitWord() {
    if (submitting || sessionEnded) return;

    const word = $("word-input").value.trim().toUpperCase();

    if (!word) {
      return setStatus("Type a word first.", true);
    }

    if (!/^[A-Z]{2,12}$/.test(word)) {
      return setStatus("Use letters only.", true);
    }

    if (
      !$("letters").textContent ||
      $("letters").textContent === "WAITING FOR ROUND…"
    ) {
      return setStatus("Wait for the next round to begin.", true);
    }

    submitting = true;
    $("submit-button").disabled = true;
    setStatus("Submitting " + word + "…");

    try {
      const result = await callGameFunction({
        action: "submit_word",
        join_code: activeCode,
        player_id: playerId,
        player_name: playerName,
        word
      });

      if (result && result.success) {
        $("word-input").value = "";
        setStatus("Accepted: " + (result.word || word) + "!");
      } else {
        setStatus((result && result.error) || "The word was not accepted.", true);
      }

      $("word-input").focus();
    } catch (error) {
      setStatus(error.message || "Couldn't submit that word. Please try again.", true);
    } finally {
      submitting = false;

      $("submit-button").disabled =
        sessionEnded ||
        $("letters").textContent === "WAITING FOR ROUND…";
    }
  }

  $("join-button").addEventListener("click", joinGame);
  $("submit-button").addEventListener("click", submitWord);

  $("player-name").value =
    localStorage.getItem("wos_mobile_player_name_v1") || "";

  $("player-name").addEventListener("change", () => {
    const name = $("player-name").value.trim();
    if (name && !isAllowedPlayerName(name)) {
      // Keep the entered name visible so joinGame can show the specific rejection.
      localStorage.removeItem("wos_mobile_player_name_v1");
      setStatus("That player name isn't allowed. Please choose another name.", true);
      return;
    }
    localStorage.setItem("wos_mobile_player_name_v1", name);
  });

  $("word-input").addEventListener("keydown", event => {
    if (event.key === "Enter") submitWord();
  });

  $("join-code").value =
    new URLSearchParams(location.search).get("code") || "";

  $("player-name").addEventListener("keydown", event => {
    if (event.key === "Enter") joinGame();
  });

  restoreActiveSession();
})();
</script>
</body>
</html>
